name: Build Setup.exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: run_tests
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) {
            $text = ($out -join "`n")
            if ($text.Length -gt 6000) { $text = $text.Substring($text.Length - 6000) }
            Set-Content -Path diag.txt -Value $text -Encoding utf8
            node scripts/post-diag.js
          }
          exit $LASTEXITCODE

      - name: Build NSIS installer
        id: build
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -Variable out
          $text = ($out -join "`n")
          if ($text.Length -gt 5000) { $text = $text.Substring($text.Length - 5000) }
          $tree = Test-Path dist ? (Get-ChildItem -Recurse dist | Format-Table FullName,Length -AutoSize | Out-String) : "DIST NOT FOUND"
          gh api -X POST "repos/zigorminsk-debug/1C-Mail/commits/$env:GITHUB_SHA/comments" -f "body=BUILD (exit $LASTEXITCODE):`n$text`n`n=== dist tree ===`n$tree"
          exit $LASTEXITCODE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-exe
          path: dist
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = (Get-ChildItem dist/*.exe | Select-Object -First 1).FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $exe --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $exe --title $env:GITHUB_REF_NAME --generate-notes
          }
