name: Build Setup.exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: run_tests
        shell: pwsh
        run: |
          npm test > test.log 2>&1
          $ec = $LASTEXITCODE
          if ($ec -ne 0) {
            (Get-Content test.log) | Where-Object { $_.Trim() } | Select-Object -Last 40 | ForEach-Object {
              $line = ($_ -replace "`r","" -replace "`n","" -replace "::","--")
              if ($line.Length -gt 0) { Write-Output "::error::$line" }
            }
          }
          exit $ec

      - name: Build NSIS installer
        id: build
        shell: pwsh
        run: |
          npm run dist > build.log 2>&1
          $ec = $LASTEXITCODE
          if ($ec -ne 0) {
            (Get-Content build.log) | Where-Object { $_.Trim() } | Select-Object -Last 40 | ForEach-Object {
              $line = ($_ -replace "`r","" -replace "`n","" -replace "::","--")
              if ($line.Length -gt 0) { Write-Output "::error::$line" }
            }
            $tree = Test-Path dist ? "dist EXISTS" : "dist NOT FOUND"
            Write-Output "::error::dist status: $tree"
          }
          exit $ec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-exe
          path: dist
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = (Get-ChildItem dist/*.exe | Select-Object -First 1).FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $exe --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $exe --title $env:GITHUB_REF_NAME --generate-notes
          }
